<style>
:root{--pri:#900C21;--sec:#FF6600;--acc:#FFC107;--bg:#F4F6F9;--cd:#fff;--tx:#1b1b1f;--mu:#6b7280;--bd:#e2e5eb;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--cd:#1c1c20;--tx:#f1f1f3;--mu:#a0a0ab;--bd:#2e2e36;--in:#26262c}}
:root[data-theme=dark]{--bg:#121212;--cd:#1c1c20;--tx:#f1f1f3;--mu:#a0a0ab;--bd:#2e2e36;--in:#26262c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif;margin:0 0 8px;letter-spacing:.3px}h2{font-size:28px}h3{font-size:21px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:linear-gradient(90deg,#900C21,#5a0514);color:#fff;border-bottom:4px solid var(--sec)}
.top img{height:50px}.top h1{margin:0;font-size:26px;letter-spacing:3px}.top small{opacity:.85}.top>div{margin-right:auto}
.sw{display:flex;background:#0005;border-radius:10px;padding:3px}.sw button,.ic{border:0;background:none;color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}.sw .on{background:var(--sec)}.ic{background:#0005}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--cd);border:1px solid var(--bd);border-left:5px solid var(--pri);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
.mu{color:var(--mu)}.sm{font-size:14px;margin:4px 0}
.g2{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:14px}@media(max-width:820px){.g2{grid-template-columns:1fr}}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--in);color:var(--tx);font:inherit;margin:4px 0}textarea{resize:vertical}
.btn{background:var(--pri);color:#fff;border:1px solid var(--pri);border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}.btn:hover{filter:brightness(1.15)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.sec{background:var(--sec);border-color:var(--sec)}.btn.ghost{background:none;color:var(--tx);border-color:var(--bd)}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--acc);color:#222}.bd.ok{background:#1f9d55;color:#fff}.bd.warn{background:var(--sec);color:#fff}.bd.blue{background:#2563eb;color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{width:auto;flex:0 0 auto}.row>.f1{flex:1 1 180px;min-width:0}
.cn{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal small{color:var(--mu);font-weight:700}
.d{position:relative;aspect-ratio:1;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);cursor:pointer;font:inherit;padding:0}
.d em{position:absolute;bottom:1px;left:0;right:0;font-size:10px;font-style:normal;color:var(--sec);font-weight:700}.d u{position:absolute;top:0;right:1px;font-size:10px;text-decoration:none}
.d.wk{opacity:.75}.d.hoy{border:2px solid var(--sec)}.d.sel{background:var(--pri);color:#fff}.d.sel em{color:var(--acc)}
.d.fer{background:repeating-linear-gradient(45deg,#FFC10040,#FFC10040 5px,transparent 5px,transparent 10px);cursor:not-allowed}.d:disabled{opacity:.55}
.bw{text-align:center}.boty{position:relative;width:140px;margin:0 auto;animation:fl 3.2s ease-in-out infinite}.boty img{width:100%;display:block}
@keyframes fl{50%{transform:translateY(-9px)}}
.eye{position:absolute;top:31%;height:9%;background:#0a0a0a;border-radius:45%;transform:scaleY(0);transform-origin:top;animation:bl 4.5s infinite}
@keyframes bl{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.boty.listen{animation:ls 1.1s ease-in-out infinite}@keyframes ls{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg) translateY(-4px)}}
.boty.proc img{animation:gl .8s ease-in-out infinite alternate}@keyframes gl{to{filter:drop-shadow(0 0 16px #FF6600) brightness(1.12)}}
.boty.proc:after{content:"⚙️";position:absolute;right:-8px;top:2px;font-size:28px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.boty.ok{animation:ok .7s ease 3}@keyframes ok{40%{transform:translateY(-20px) scale(1.07)}}
.boty.ok:after{content:"👍";position:absolute;left:-14px;top:36%;font-size:30px;animation:pop .7s ease}@keyframes pop{from{transform:scale(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.bub{display:inline-block;background:var(--cd);border:2px solid var(--sec);border-radius:14px;padding:6px 12px;font-size:14px;margin:8px 0}
.kps{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:10px 0}.kp{background:var(--cd);border:1px solid var(--bd);border-top:4px solid var(--acc);border-radius:12px;padding:8px;text-align:center}.kp b{display:block;font:700 26px "Barlow Condensed",sans-serif;color:var(--sec)}.kp span{font-size:13px;color:var(--mu)}
.kw{color:var(--sec)}.task{border:1px dashed var(--bd);border-radius:10px;padding:8px;margin:8px 0}
.warn{background:#FFC10033;border:1px solid var(--acc);padding:8px 10px;border-radius:9px;margin:6px 0}
.cred{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#900C21,#4a0510);color:#fff;border-radius:14px;padding:14px;border-bottom:5px solid var(--sec);margin:10px 0}.cred img{height:84px}.cred h3{margin:2px 0 6px}
.code{display:inline-block;background:var(--acc);color:#222;font-weight:700;padding:2px 12px;border-radius:8px;letter-spacing:1px}
.obs{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--acc);border-radius:10px;padding:10px;margin:8px 0}
.tb{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{background:var(--pri);color:#fff}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.pk{cursor:pointer}.pk:hover{border-left-color:var(--sec)}
.lg{max-width:460px;margin:20px auto;text-align:center}.lg img{width:190px}.tabs{display:flex;gap:6px;margin:10px 0}.tabs .btn{flex:1;padding:9px 4px}
.fb{position:fixed;z-index:60;right:14px;bottom:14px;touch-action:none}.fb .av{width:84px;display:block;cursor:grab;user-select:none;filter:drop-shadow(0 6px 10px #0004);animation:fl 3.2s ease-in-out infinite}.fb.mv .av{animation:wg .4s ease}@keyframes wg{30%{transform:rotate(-9deg) translateY(-8px)}70%{transform:rotate(7deg)}}
.pn{position:absolute;width:min(340px,92vw);background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-top:4px solid var(--sec);border-radius:14px;box-shadow:0 8px 28px #0005;display:flex;flex-direction:column;max-height:70vh}.ms{overflow-y:auto;padding:10px;flex:1;min-height:140px}.ms p{margin:6px 0;padding:7px 10px;border-radius:12px;white-space:pre-wrap;font-size:14px;max-width:92%}.ms .b{background:var(--in);border:1px solid var(--bd)}.ms .u{background:var(--pri);color:#fff;margin-left:auto}
.tick{display:flex;align-items:center;gap:8px;background:#0006;border:1px solid var(--acc);border-radius:99px;padding:4px 12px;font-size:14px}.tick span{font-variant-numeric:tabular-nums;font-weight:700;color:var(--acc)}.tick.urg{animation:tk 1s steps(2) infinite}@keyframes tk{50%{background:#FF660088}}
.menu{position:absolute;right:0;top:115%;z-index:70;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:8px;display:grid;gap:6px;width:250px;box-shadow:0 8px 24px #0005}.rec{border-color:#d00;color:#d00}.chk{display:flex;align-items:center;gap:6px;font-size:14px}.chk input{width:auto;margin:0}
</style></head>
